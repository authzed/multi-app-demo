services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 5


  groups-service:
    build: ./groups-service
    ports:
      - "3001:3001"
    environment:
      - GIN_MODE=release
      - DATABASE_URL=postgres://demo:demo123@postgres:5432/groups_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy


  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - groups-service

volumes:
  postgres_data: